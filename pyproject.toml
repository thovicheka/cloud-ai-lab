[project]
name = "cloud-ai-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.112",
    "modal>=1.6.1",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
    "wandb==0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
